hostname R2
no ip domain-lookup
!
interface GigabitEthernet0/0
 description to R1
 ip address 10.1.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description to R3
 ip address 10.1.23.1 255.255.255.252
 no shutdown
!
ip route 192.168.10.0 255.255.255.0 10.1.12.1
ip route 192.168.30.0 255.255.255.0 10.1.23.2
!
end
